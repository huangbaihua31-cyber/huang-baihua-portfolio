    @keyframes rvUp { from { opacity:0; transform:translate3d(0,20px,0); } to { opacity:1; transform:none; } }
    @keyframes rvWipe { from { opacity:0; clip-path:inset(-30% 100% -30% -4%); transform:translate3d(0,14px,0); } to { opacity:1; clip-path:inset(-30% -30% -30% -4%); transform:none; } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .intro .stage { clip-path:inset(0 50% 0 50% round var(--radius) var(--radius) 0 0); }
    .intro #bgv,.intro .video-frame,.intro .rv,.intro .rv-wipe { opacity:0; }

    .intro-go #bgv,.intro-go .video-frame { opacity:1; animation:fadeIn 680ms ease 60ms backwards; }
    .intro-go .rv { opacity:1; animation:rvUp 720ms cubic-bezier(.22,.7,.2,1) backwards; animation-delay:var(--d,0ms); }
    .intro-go .rv-wipe { opacity:1; animation:rvWipe 820ms cubic-bezier(.22,.7,.2,1) backwards; animation-delay:var(--d,0ms); }

    }

window.mountPersonalWorks=function(DATA){
  const person=DATA.personal,projects=DATA.projects,visuals=projects.filter(p=>p.kind==='design'),videos=projects.filter(p=>p.kind==='video');

  document.body.append(box);
  let active='resume',theme='概念与自然',category='广告短片',selectedVideo=null,imageItems=[],imageIndex=0,focusReturn=null,imageFocus=null;
  const positions=new Map(),playback=new Map(),listPositions=new Map();
  let carousels=[],mediaProject=null,mediaFocus=null,mediaWasPlaying=false,inlineClickTimer=0;
  const mediaBox=document.createElement('dialog');mediaBox.className='media-dialog';mediaBox.setAttribute('aria-label','视频放大播放');
  mediaBox.innerHTML='<header><h3></h3><button data-media-close aria-label="关闭放大视频">关闭 ×</button></header><video controls playsinline preload="metadata"></video><footer><span>Esc 返回项目</span><a download>下载视频 ↓</a></footer>';
  document.body.append(mediaBox);
  const suspendCarousels=value=>carousels.forEach(c=>c.setSuspended(value));
  const disposeCarousels=()=>{carousels.forEach(c=>c.destroy());carousels=[];};

  const openImage=(index,source)=>{imageIndex=index;imageFocus=source;showImage();suspendCarousels(true);box.showModal();};
  const openVideo=(project,source)=>{
    mediaProject=project;mediaFocus=source;const inline=main.querySelector('#project-video');
    mediaWasPlaying=Boolean(inline&&!inline.paused&&selectedVideo===project.id);
    const current=inline&&selectedVideo===project.id?inline.currentTime:playback.get(project.id)||0;
    stopVideos();suspendCarousels(true);
    const player=mediaBox.querySelector('video');mediaBox.querySelector('h3').textContent=project.title;
    PortfolioVideo.downloadLink(mediaBox.querySelector('a'),project);player.poster=project.cover.display;PortfolioVideo.attach(player,project);
    player.addEventListener('loadedmetadata',()=>{if(current)player.currentTime=Math.min(current,player.duration||current);},{once:true});
    mediaBox.showModal();PortfolioVideo.play(player).catch(()=>{});
  };
  const key=()=>active==='visuals'?'visuals:'+theme:active==='videos'?'videos:'+category:active;
  const remember=()=>{positions.set(key(),main.scrollTop);const v=main.querySelector('#project-video');if(v&&selectedVideo)playback.set(selectedVideo,v.currentTime);};

  };
  const renderVisuals=()=>{

  const renderVideos=()=>{

    detail.innerHTML='<div class="project-toolbar"><button data-collapse-video>← 返回列表</button><button data-jump="project-assets">查看资产 '+selected.images.length+' ↓</button><div class="project-step"><button data-step="'+esc(previous?.id||'')+'" '+(!previous?'disabled':'')+'>上一个</button><span>'+(index+1)+' / '+filtered.length+'</span><button data-step="'+esc(next?.id||'')+'" '+(!next?'disabled':'')+'>下一个</button></div></div><div class="selected-heading"><div><p class="gallery-kicker">'+esc(DATA.videoLabels[selected.id]||'收录影像资料')+'</p><h3>'+esc(selected.title)+'</h3></div><button class="video-enlarge" data-enlarge-video>放大播放 ↗</button></div><div class="project-player"><video id="project-video" controls playsinline preload="metadata" poster="'+esc(selected.cover.display)+'" src="'+esc(selected.video)+'" aria-label="'+esc(selected.title)+'，双击放大"></video><button class="video-hit-area" aria-label="双击放大项目视频"><span>单击播放 / 暂停 · 双击放大 ↗</span></button></div><p class="video-error" role="alert" hidden>视频暂时无法播放，请刷新后重试，或下载查看。</p><div class="project-actions"><a href="'+esc(selected.video)+'" download>下载视频 ↓</a>'+(selected.id==='video-material-1'?'<a href="'+esc(person.perfumeDocument)+'" target="_blank" rel="noreferrer">查看镜头拆解与复现脚本 ↗</a>':'')+'</div><details class="project-notes"><summary>项目资料与制作说明</summary><p>'+esc(selected.description)+'</p></details><div class="attached-title" id="project-assets" tabindex="-1"><h4>配套创作资产</h4><span>'+selected.images.length+' 张 · 双击放大</span></div>'+(groups.length?'<nav class="asset-jumps" aria-label="本项目资产类型">'+groups.map((g,i)=>'<button data-jump="asset-group-'+i+'">'+g.label+' '+g.items.length+'</button>').join('')+'</nav>'+groups.map((group,i)=>'<section class="asset-group" id="asset-group-'+i+'" tabindex="-1"><h5>'+group.label+' <small>'+group.items.length+' 张</small></h5><div class="asset-carousel" data-asset-carousel="'+i+'"></div></section>').join(''):'<p class="empty-assets">当前收录视频，尚未提供可确认对应的配套资产。</p>');
    main.querySelector('.video-detail-host').append(detail);
    groups.forEach((group,i)=>mountCarousel(detail.querySelector('[data-asset-carousel="'+i+'"]'),group.items.map(item=>({src:item.image.display,aspect:item.image.width/item.image.height,alt:item.image.alt,title:item.image.alt,subtitle:selected.title,globalIndex:item.globalIndex})),{effect:'flex',label:selected.title+' · '+group.label+'资产轮播',cardWidth:240,aspectRatio:.8,onOpen:(item,index,source)=>openImage(item.globalIndex,source)}));
    const player=main.querySelector('#project-video');PortfolioVideo.attach(player,selected);PortfolioVideo.downloadLink(detail.querySelector('.project-actions a[download]'),selected);player.addEventListener('error',()=>{main.querySelector('.video-error').hidden=false;});
    const videoHit=detail.querySelector('.video-hit-area');
    videoHit.addEventListener('click',event=>{clearTimeout(inlineClickTimer);if(event.detail===0){openVideo(selected,videoHit);return;}if(event.detail<2)inlineClickTimer=setTimeout(()=>{if(player.paused)PortfolioVideo.play(player).catch(()=>{});else player.pause();},240);});
    videoHit.addEventListener('dblclick',event=>{event.preventDefault();clearTimeout(inlineClickTimer);openVideo(selected,videoHit);});
    restorePlayer();
  };
  const renderContact=()=>{
    main.innerHTML='<section class="contact-panel"><div class="contact-copy"><p class="gallery-kicker">联系与合作</p><h3>让下一段故事，<br>从这里开始。</h3><p class="contact-intro">欢迎交流 AI 视觉、短剧制作与视频后期相关机会。</p>'+contacts()+'<a class="filled-link" href="'+esc(person.resume)+'" target="_blank" rel="noreferrer">查看个人简历 ↗</a></div><figure class="contact-portrait"><img src="demo-assets/contact-portrait-20261013.webp" alt="黄柏华个人照片，夕阳街景" width="1086" height="1448"><figcaption>黄柏华 <span>AI 视觉 · 短剧与后期</span></figcaption></figure></section>';
  };
  const render=()=>{
    stopVideos();disposeCarousels();title.textContent=tabs.find(t=>t[0]===active)[1];
    nav.innerHTML=tabs.map(([id,label])=>'<button data-tab="'+id+'" aria-pressed="'+(active===id)+'">'+label+'</button>').join('');
    if(active==='resume')renderResume();else if(active==='visuals')renderVisuals();else if(active==='videos')renderVideos();else renderContact();
    updateFilterSize();main.scrollTop=positions.get(key())||0;
  };
  const showImage=()=>{
    const item=imageItems[imageIndex],image=box.querySelector('#artwork-image');if(!item)return;
    box.classList.remove('is-zoomed');box.querySelector('[data-zoom]').setAttribute('aria-pressed','false');box.querySelector('[data-zoom]').textContent='放大';
    image.src=item.image.full;image.alt=item.image.alt;box.querySelector('figcaption').textContent=item.title;
    box.querySelector('#image-counter').textContent=(imageIndex+1)+' / '+imageItems.length;
    const link=box.querySelector('#image-download');link.href=item.image.full;
    box.querySelector('[data-prev]').disabled=imageItems.length<2;box.querySelector('[data-next]').disabled=imageItems.length<2;
  };
  const selectVideo=(id,fromList=true)=>{
    remember();if(fromList)listPositions.set(category,main.scrollTop);
    selectedVideo=id;render();
    const detail=main.querySelector('#selected-video');if(!detail)return;
    detail.focus({preventScroll:true});moveTo(detail);
    const v=main.querySelector('#project-video');PortfolioVideo.play(v).catch(()=>{});
  };
  const returnToList=()=>{
    const id=selectedVideo;remember();selectedVideo=null;render();
    main.scrollTop=listPositions.get(category)||0;
    const carousel=carousels[0];carousel?.focus(categoryVideos().findIndex(p=>p.id===id));main.querySelector('#video-carousel')?.focus({preventScroll:true});
  };
  main.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.theme){remember();theme=button.dataset.theme;render();main.querySelector('[data-theme][aria-pressed="true"]').focus({preventScroll:true});}
    else if(button.dataset.category){remember();category=button.dataset.category;selectedVideo=null;render();main.querySelector('[data-category][aria-pressed="true"]').focus({preventScroll:true});}
    else if(button.dataset.video){if(selectedVideo===button.dataset.video)returnToList();else selectVideo(button.dataset.video);}
    else if(button.hasAttribute('data-enlarge-video'))openVideo(videos.find(p=>p.id===selectedVideo),button);
    else if(button.hasAttribute('data-collapse-video'))returnToList();
    else if(button.dataset.step)selectVideo(button.dataset.step,false);
    else if(button.dataset.jump){const target=main.querySelector('#'+button.dataset.jump);target?.focus({preventScroll:true});moveTo(target);}
    else if(button.hasAttribute('data-image'))openImage(Number(button.dataset.image),button);
  });
  nav.addEventListener('click',event=>{const button=event.target.closest('[data-tab]');if(button){remember();active=button.dataset.tab;render();nav.querySelector('[aria-pressed="true"]').focus({preventScroll:true});}});
  dialog.querySelector('.work-close').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('close',()=>{remember();stopVideos();suspendCarousels(true);if(box.open)box.close();if(mediaBox.open)mediaBox.close();document.body.style.overflow='';if(focusReturn?.isConnected)focusReturn.focus({preventScroll:true});});
  box.querySelector('[data-image-close]').addEventListener('click',()=>box.close());
  box.addEventListener('close',()=>{if(dialog.open)suspendCarousels(false);if(imageFocus?.isConnected)imageFocus.focus({preventScroll:true});});
  box.querySelector('#artwork-image').addEventListener('dblclick',event=>{event.preventDefault();box.querySelector('[data-zoom]').click();});
  mediaBox.querySelector('[data-media-close]').addEventListener('click',()=>mediaBox.close());
  mediaBox.addEventListener('close',()=>{
    const player=mediaBox.querySelector('video'),time=player.currentTime;PortfolioVideo.detach(player);player.pause();
    if(mediaProject)playback.set(mediaProject.id,time);player.removeAttribute('src');player.load();
    const inline=main.querySelector('#project-video');if(inline&&mediaProject?.id===selectedVideo){inline.currentTime=time;if(mediaWasPlaying&&dialog.open)PortfolioVideo.play(inline).catch(()=>{});}
    if(dialog.open)suspendCarousels(false);if(mediaFocus?.isConnected)mediaFocus.focus({preventScroll:true});
  });
  box.querySelector('[data-prev]').addEventListener('click',()=>{imageIndex=(imageIndex-1+imageItems.length)%imageItems.length;showImage();});
  box.querySelector('[data-next]').addEventListener('click',()=>{imageIndex=(imageIndex+1)%imageItems.length;showImage();});
  document.addEventListener('keydown',event=>{if(!box.open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();imageIndex=(imageIndex+(event.key==='ArrowLeft'?-1:1)+imageItems.length)%imageItems.length;showImage();}});
  box.querySelector('[data-zoom]').addEventListener('click',()=>{const zoomed=box.classList.toggle('is-zoomed');const button=box.querySelector('[data-zoom]');button.setAttribute('aria-pressed',String(zoomed));button.textContent=zoomed?'适应屏幕':'放大';});
  let swipe=null;
  const imageStage=box.querySelector('.image-stage');
  imageStage.addEventListener('pointerdown',event=>{if(event.pointerType==='touch'&&!box.classList.contains('is-zoomed')&&!event.target.closest('button'))swipe={id:event.pointerId,x:event.clientX,y:event.clientY};});
  imageStage.addEventListener('pointerup',event=>{if(!swipe||swipe.id!==event.pointerId)return;const dx=event.clientX-swipe.x,dy=event.clientY-swipe.y;swipe=null;if(Math.abs(dx)>48&&Math.abs(dy)<Math.abs(dx)*.6){imageIndex=(imageIndex+(dx<0?1:-1)+imageItems.length)%imageItems.length;showImage();}});
  imageStage.addEventListener('pointercancel',()=>{swipe=null;});
  [dialog,box,mediaBox].forEach(d=>d.addEventListener('click',event=>{if(event.target!==d)return;const r=d.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)d.close();}));
  return {open(tab){if(dialog.open)remember();focusReturn=document.activeElement;active=tabs.some(t=>t[0]===tab)?tab:'visuals';render();if(!dialog.open)dialog.showModal();document.body.style.overflow='hidden';},close(){dialog.close();}};
};

</script>

<script src="demo-assets/home-effects-v10.js"></script>
